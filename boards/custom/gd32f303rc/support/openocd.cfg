source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
# GD32F303 uses the STM32F1-compatible flash interface, not GD32F3x0.
# Connection and flash programming still require validation on this board.
set CHIPNAME gd32f303rc
set CPUTAPID 0x2ba01477
set FLASH_SIZE 0x40000
set WORKAREASIZE 0x1000
source [find target/stm32f1x.cfg]
reset_config none
